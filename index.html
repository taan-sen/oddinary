<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oddyssey</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Background Symbols -->
  <div class="background-symbols">
    <!-- All runic symbols with random directional animations -->
    <!-- Row 1 - different directions, positions and timings -->
    <span style="left: 5%; animation-name: floatUpRight; animation-duration: 28s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 0s;">ᚠ</span>
    <span style="left: 15%; animation-name: floatDownLeft; animation-duration: 34s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 5s;">ᚢ</span>
    <span style="left: 25%; animation-name: floatUpLeft; animation-duration: 30s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 10s;">ᚦ</span>
    <span style="left: 35%; animation-name: floatDownRight; animation-duration: 36s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 2s;">ᚨ</span>
    <span style="left: 45%; animation-name: floatUpRight; animation-duration: 32s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 8s;">ᚱ</span>
    <span style="left: 55%; animation-name: floatDownLeft; animation-duration: 29s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 15s;">ᚲ</span>
    <span style="left: 65%; animation-name: floatUpLeft; animation-duration: 33s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 7s;">ᚷ</span>
    <span style="left: 75%; animation-name: floatDownRight; animation-duration: 31s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 12s;">ᚹ</span>
    <span style="left: 85%; animation-name: floatUpRight; animation-duration: 35s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 3s;">ᚺ</span>
    <span style="left: 95%; animation-name: floatDownLeft; animation-duration: 27s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 18s;">ᛉ</span>
    
    <!-- Row 2 - more runic symbols -->
    <span style="left: 10%; animation-name: floatUpLeft; animation-duration: 29s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 22s;">ᛃ</span>
    <span style="left: 20%; animation-name: floatDownRight; animation-duration: 34s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 4s;">ᛇ</span>
    <span style="left: 30%; animation-name: floatUpRight; animation-duration: 26s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 9s;">ᛈ</span>
    <span style="left: 40%; animation-name: floatDownLeft; animation-duration: 32s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 16s;">ᛊ</span>
    <span style="left: 50%; animation-name: floatUpLeft; animation-duration: 30s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 1s;">ᛋ</span>
    <span style="left: 60%; animation-name: floatDownRight; animation-duration: 28s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 14s;">ᛏ</span>
    <span style="left: 70%; animation-name: floatUpRight; animation-duration: 35s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 6s;">ᛒ</span>
    <span style="left: 80%; animation-name: floatDownLeft; animation-duration: 27s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 19s;">ᛖ</span>
    <span style="left: 90%; animation-name: floatUpLeft; animation-duration: 33s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 11s;">ᛗ</span>
    
    <!-- Row 3 - even more runic symbols -->
    <span style="left: 7%; animation-name: floatDownRight; animation-duration: 31s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 17s;">ᛚ</span>
    <span style="left: 17%; animation-name: floatUpRight; animation-duration: 29s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 8s;">ᛞ</span>
    <span style="left: 27%; animation-name: floatDownLeft; animation-duration: 34s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 13s;">ᛟ</span>
    <span style="left: 37%; animation-name: floatUpLeft; animation-duration: 32s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 0s;">ᚻ</span>
    <span style="left: 47%; animation-name: floatDownRight; animation-duration: 28s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 20s;">ᚾ</span>
    <span style="left: 57%; animation-name: floatUpRight; animation-duration: 30s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 5s;">ᚪ</span>
    <span style="left: 67%; animation-name: floatDownLeft; animation-duration: 35s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 15s;">ᚫ</span>
    <span style="left: 77%; animation-name: floatUpLeft; animation-duration: 27s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 10s;">ᚣ</span>
    <span style="left: 87%; animation-name: floatDownRight; animation-duration: 33s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 2s;">ᚸ</span>
    <span style="left: 97%; animation-name: floatUpRight; animation-duration: 29s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 25s;">ᛠ</span>
    
    <!-- Row 4 - additional runic symbols -->
    <span style="left: 12%; animation-name: floatDownLeft; animation-duration: 31s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 9s;">ᛡ</span>
    <span style="left: 22%; animation-name: floatUpLeft; animation-duration: 28s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 22s;">ᛢ</span>
    <span style="left: 32%; animation-name: floatDownRight; animation-duration: 34s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 7s;">ᛣ</span>
    <span style="left: 42%; animation-name: floatUpRight; animation-duration: 30s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 18s;">ᛤ</span>
    <span style="left: 52%; animation-name: floatDownLeft; animation-duration: 36s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 3s;">ᛥ</span>
    <span style="left: 62%; animation-name: floatUpLeft; animation-duration: 29s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 21s;">ᛦ</span>
    <span style="left: 72%; animation-name: floatDownRight; animation-duration: 33s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 6s;">ᛩ</span>
    <span style="left: 82%; animation-name: floatUpRight; animation-duration: 27s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 19s;">ᛪ</span>
    <span style="left: 92%; animation-name: floatDownLeft; animation-duration: 35s; animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: 1s;">ᛮ</span>
  </div>

  <!-- Main Container -->
  <div class="container">
    <h1>Is it odd?</h1>
    <div class="input-group">
      <input type="text" id="numberInput" placeholder="Enter a numeric string" />
      <button onclick="checkOdd()">Check</button>
    </div>
    <div id="response" class="response-message"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
